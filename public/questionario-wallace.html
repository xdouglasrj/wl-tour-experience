        const STORAGE_KEY = 'wlTourAnswers';
        const formDiv = document.getElementById('form');
        const progressBar = document.getElementById('progress-bar');
        const statusDiv = document.getElementById('status');
        const downloadBtn = document.getElementById('download-btn');
        const shareBtn = document.getElementById('share-btn');
        const clearBtn = document.getElementById('clear-btn');
        
        // Initialize form
        function initForm() {
            // Load answers from localStorage
            let answers = {};
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    answers = JSON.parse(stored);
                }
            } catch (e) {
                showStatus('Não foi possível acessar o armazenamento local. As respostas não serão preservadas.', 'error');
            }
            
            // Build form
            let html = '';
            
            // Indispensable questions
            html += '<div class="form-section"><h2>Informações Indispensáveis</h2>';
            questions
                .filter(q => indispensableSet.has(q.num))
                .forEach(q => {
                    html += `
                        <div class="question">
                            <label for="q${q.num}">${q.num}. ${q.text} <span class="indispensable-label">Obrigatória</span></label>
                            <input type="text" id="q${q.num}" value="${answers[q.num] || ''}">
                        </div>
                    `;
                });
            html += '</div>';
            
            // Additional questions by group
            for (const [groupName, questionNums] of Object.entries(additionalGroups)) {
                html += `
                    <div class="collapsible">
                        <button class="collapsible-header">${groupName}</button>
                        <div class="collapsible-content">
                            <div class="form-section">
                `;
                questionNums.forEach(num => {
                    const q = questions.find(qq => qq.num === num);
                    if (q) {
                        html += `
                            <div class="question">
                                <label for="q${num}">${num}. ${q.text}</label>
                                <input type="text" id="q${num}" value="${answers[num] || ''}">
                            </div>
                        `;
                    }
                });
                html += `
                            </div>
                        </div>
                    </div>
                `;
            }
            
            formDiv.innerHTML = html;
            
            // Add event listeners to inputs
            document.querySelectorAll('input[type="text"]').forEach(input => {
                input.addEventListener('input', saveAnswer);
                // Restore value if exists
                const num = parseInt(input.id.substring(1));
                if (answers[num] !== undefined) {
                    input.value = answers[num];
                }
            });
            
            // Add event listeners to collapsible headers
            document.querySelectorAll('.collapsible-header').forEach(header => {
                header.addEventListener('click', () => {
                    const content = header.nextElementSibling;
                    content.classList.toggle('show');
                });
            });
            
            // Update progress
            updateProgress();
            
            // Button event listeners
            downloadBtn.addEventListener('click', downloadAnswers);
            shareBtn.addEventListener('click', shareAnswers);
            clearBtn.addEventListener('click', clearAnswers);
        }
        
        function saveAnswer() {
            const num = parseInt(this.id.substring(1));
            const value = this.value.trim();
            
            let answers = {};
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    answers = JSON.parse(stored);
                }
            } catch (e) {
                showStatus('Erro ao salvar resposta.', 'error');
                return;
            }
            
            if (value) {
                answers[num] = value;
            } else {
                delete answers[num];
            }
            
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(answers));
                updateProgress();
                showStatus('Resposta salva.', 'success');
            } catch (e) {
                showStatus('Não foi possível salvar no armazenamento local.', 'error');
            }
        }
        
        function updateProgress() {
            let answers = {};
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    answers = JSON.parse(stored);
                }
            } catch (e) {
                // Ignore
            }
            
            const answered = Array.from(indispensableSet).filter(num => answers[num] !== undefined && answers[num].trim() !== '').length;
            const total = indispensableSet.size;
            const percent = Math.round((answered / total) * 100);
            progressBar.style.width = percent + '%';
            progressBar.textContent = percent + '%';
            
            // Enable/disable buttons based on indispensable answers
            const allIndispensableAnswered = Array.from(indispensableSet).every(num => {
                const val = answers[num];
                return val !== undefined && val.trim() !== '';
            });
            
            downloadBtn.disabled = !allIndispensableAnswered;
            shareBtn.disabled = !allIndispensableAnswered;
        }
        
        function showStatus(message, type = 'info') {
            statusDiv.textContent = message;
            statusDiv.className = `status-message ${type}`;
        }
        
        function downloadAnswers() {
            // Check if all indispensable are answered
            let answers = {};
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    answers = JSON.parse(stored);
                }
} catch (e) {
                 showStatus('Erro ao ler respostas.', 'error');
                 return;
             }
             
             const missing = Array.from(indispensableSet).filter(num => {
                 const val = answers[num];
                 return val === undefined || val.trim() === '';
             });
             if (missing.length > 0) {
                 showStatus(`Por favor, responda ${missing.length} pergunta(s) indispensável(is) antes de gerar o arquivo.`, 'error');
                // Focus first missing
                const firstMissing = missing[0];
                const input = document.getElementById(`q${firstMissing}`);
                if (input) {
                    input.focus();
                    input.scrollIntoView({behavior: 'smooth', block: 'center'});
                }
                return;
            }
            
            // Generate markdown
            const date = new Date();
            const dateString = date.toISOString().split('T')[0]; // YYYY-MM-DD
            const filename = `respostas-wl-tour-${dateString}.md`;
            
            let markdown = `# WL Tour Experience\n`;
            markdown += `Data: ${dateString}\n`;
            markdown += `Total respondido: ${Object.keys(answers).length} de ${questions.length}\n\n`;
            
            // Add indispensable section
            markdown += '## Informações Indispensáveis\n\n';
            questions
                .filter(q => indispensableSet.has(q.num))
                .forEach(q => {
                    const answer = answers[q.num] || 'Pendente';
                    markdown += `### ${q.num}. ${q.text}\n\n`;
                    markdown += `Resposta: ${answer}\n\n`;
                });
            
            // Add additional sections
            for (const [groupName, questionNums] of Object.entries(additionalGroups)) {
                markdown += `## ${groupName}\n\n`;
                questionNums.forEach(num => {
                    const q = questions.find(qq => qq.num === num);
                    if (q) {
                        const answer = answers[num] || 'Pendente';
                        markdown += `### ${num}. ${q.text}\n\n`;
                        markdown += `Resposta: ${answer}\n\n`;
                    }
                });
            }
            
            // Create blob and download
            const blob = new Blob([markdown], {type: 'text/markdown'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            showStatus(`Arquivo ${filename} baixado com sucesso.`, 'success');
        }
        
        async function shareAnswers() {
            // Check if all indispensable are answered
            let answers = {};
            try {
                const stored = localStorage.getItem(STORAGE_KEY);
                if (stored) {
                    answers = JSON.parse(stored);
                }
} catch (e) {
                 showStatus('Erro ao ler respostas.', 'error');
                 return;
             }
             
             const missing = Array.from(indispensableSet).filter(num => {
                 const val = answers[num];
                 return val === undefined || val.trim() === '';
             });
             if (missing.length > 0) {
                 showStatus(`Por favor, responda ${missing.length} pergunta(s) indispensável(is) antes de compartilhar.`, 'error');
                const firstMissing = missing[0];
                const input = document.getElementById(`q${firstMissing}`);
                if (input) {
                    input.focus();
                    input.scrollIntoView({behavior: 'smooth', block: 'center'});
                }
                return;
            }
            
            // Generate markdown (same as download)
            const date = new Date();
            const dateString = date.toISOString().split('T')[0]; // YYYY-MM-DD
            const filename = `respostas-wl-tour-${dateString}.md`;
            
            let markdown = `# WL Tour Experience\n`;
            markdown += `Data: ${dateString}\n`;
            markdown += `Total respondido: ${Object.keys(answers).length} de ${questions.length}\n\n`;
            
            // Add indispensable section
            markdown += '## Informações Indispensáveis\n\n';
            questions
                .filter(q => indispensableSet.has(q.num))
                .forEach(q => {
                    const answer = answers[q.num] || 'Pendente';
                    markdown += `### ${q.num}. ${q.text}\n\n`;
                    markdown += `Resposta: ${answer}\n\n`;
                });
            
            // Add additional sections
            for (const [groupName, questionNums] of Object.entries(additionalGroups)) {
                markdown += `## ${groupName}\n\n`;
                questionNums.forEach(num => {
                    const q = questions.find(qq => qq.num === num);
                    if (q) {
                        const answer = answers[num] || 'Pendente';
                        markdown += `### ${num}. ${q.text}\n\n`;
                        markdown += `Resposta: ${answer}\n\n`;
                    }
                });
            }
            
            // Try to share via Web Share API
            try {
                const blob = new Blob([markdown], {type: 'text/markdown'});
                const file = new File([blob], filename, {type: 'text/markdown'});
                
                if (navigator.canShare && navigator.canShare({files: [file]})) {
                    await navigator.share({
                        files: [file],
                        title: 'Respostas do Questionário WL Tour Experience',
                        text: 'Veja minhas respostas ao questionário da WL Tour Experience.'
                    });
                    showStatus('Compartilhado com sucesso.', 'success');
                } else {
                    throw new Error('Web Share API not supported or cannot share files');
                }
            } catch (e) {
                // Fallback: download and show instructions
                downloadAnswers(); // This will download and show success message
                showStatus('Para compartilhar no WhatsApp, anexe o arquivo baixado manualmente.', 'info');
            }
        }
        
        function clearAnswers() {
            if (confirm('Tem certeza que deseja apagar todas as respostas? Esta ação não pode ser desfeita.')) {
                try {
                    localStorage.removeItem(STORAGE_KEY);
                    // Reset form
                    document.querySelectorAll('input[type="text"]').forEach(input => {
                        input.value = '';
                    });
                    updateProgress();
                    showStatus('Todas as respostas foram apagadas.', 'success');
                } catch (e) {
                    showStatus('Erro ao apagar respostas.', 'error');
                }
            }
        }
        
        // Initialize on load
        window.addEventListener('DOMContentLoaded', initForm);
    </script>
